spring:
  application:
    name: aceleraflix

  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-access: 900000
  expiration-refresh: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

youtube:
  api:
    key: ${YOUTUBE_API_KEY}
    shorts:
      canais: ${YOUTUBE_SHORTS_CANAIS:@filipedeschamps,@rocketseat,@codigofontetv,@LucasMontano,@devfiasco}
      keywords: ${YOUTUBE_SHORTS_KEYWORDS:programação,programar,dev,developer,código,software,javascript,typescript,python,java,react,node,backend,frontend,fullstack,devops,docker,kubernetes,linux,sql,banco de dados,database,api,git,github,cloud,aws,azure,ia,chatgpt,gpt,openai,deepseek,machine learning,cybersecurity,segurança,framework,web,mobile,flutter,react native,html,css,testes,carreira,vaga,tecnologia,tech,startup,google,microsoft,apple,android,iphone,tesla,hardware,chrome,browser,app,dados,entrevista}
      max-por-canal: ${YOUTUBE_SHORTS_MAX_POR_CANAL:50}