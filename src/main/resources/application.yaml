spring:
  application:
    name: aceleraflix

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expiration-access: 900000
  expiration-refresh: 604800000

youtube:
  api:
    key: ${YOUTUBE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}

rate-limit:
  read-per-minute: ${RATE_LIMIT_READ_PER_MINUTE:360}
  write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:120}
  auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
  refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:60}
  trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
